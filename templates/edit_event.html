{% extends "index.html" %}
{% from "bootstrap5/form.html" import render_form %}
{% block title %}
    Редагувати подію
{% endblock %}

{% block main %}

    <div class="container mt-4">
        <nav class="navbar navbar-expand bg-1">
            <div class="container-fluid justify-content-start">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a type="button"
                           class="nav-link active"
                           aria-current="page"
                           href="{{ url_for('home') }}">
                            Back
                        </a>
                     </li>
                </ul>
            </div>
        </nav>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4 mt-5 rounded-4 overflow-hidden bg-white bg-opacity-50">
                    <h2 class="mb-3">Edit Event</h2>
                    {{ render_form(form, novalidate=True) }}
                </div>
            </div>
        </div>
    </div>

{% endblock %}
